name: Build Android APK

on:
  push:
    branches: [arena/efd27e44-spotify, main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Public HTTPS URL of the Tonal backend (overrides the BACKEND_URL repository variable)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve backend URL
        id: backend
        env:
          INPUT_URL: ${{ inputs.backend_url }}
          VAR_URL: ${{ vars.BACKEND_URL }}
        run: |
          url="${INPUT_URL:-$VAR_URL}"
          url="${url%/}"
          if [ -z "$url" ]; then
            echo "::warning::No BACKEND_URL set. The APK will open, but search and downloads will not work until it points at a hosted backend."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build web app
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ steps.backend.outputs.url }}
          CI: "false"
        run: yarn build

      - name: Sync web assets into the Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK to the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-latest
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk tonal-debug.apk
          notes="Debug build of Tonal from commit ${GITHUB_SHA:0:7} (branch ${GITHUB_REF_NAME}). Allow installs from unknown sources on the phone to install it."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes" --target "$GITHUB_SHA" --prerelease
          else
            gh release create "$TAG" --prerelease --title "Tonal Android (latest debug build)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" tonal-debug.apk --clobber
