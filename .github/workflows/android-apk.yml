name: Build Android APK

on:
  push:
    branches: [arena/efd27e44-spotify, main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Public HTTPS URL of the Tonal backend (overrides the BACKEND_URL repository variable)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Resolve backend URL
        id: backend
        env:
          INPUT_URL: ${{ inputs.backend_url }}
          VAR_URL: ${{ vars.BACKEND_URL }}
        run: |
          url="${INPUT_URL:-$VAR_URL}"
          url="${url%/}"
          if [ -z "$url" ]; then
            echo "::warning::No BACKEND_URL set. The APK will open, but search and downloads will not work until it points at a hosted backend."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build web app
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ steps.backend.outputs.url }}
          CI: "false"
        run: yarn build

      - name: Sync web assets into the Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tonal-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
